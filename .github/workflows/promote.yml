name: Pylos Promotion

on:
  workflow_dispatch:

jobs:
  promote:
    name: 🚀 Promote Dev to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote Multi-Arch Manifests to :latest
        run: |
          echo "Promoting Backend multi-arch manifest :dev -> :latest..."
          docker buildx imagetools create -t ghcr.io/jzacharie/pylos:latest ghcr.io/jzacharie/pylos:dev
          echo "Promoting Frontend multi-arch manifest :dev -> :latest..."
          docker buildx imagetools create -t ghcr.io/jzacharie/pylos-ui:latest ghcr.io/jzacharie/pylos-ui:dev

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_CONTENT" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Restart Production Deployment
        run: |
          kubectl rollout restart deployment pylos-server -n pylos
          kubectl rollout restart deployment pylos-ui -n pylos
          kubectl rollout status deployment pylos-server -n pylos
          kubectl rollout status deployment pylos-ui -n pylos

      - name: Notify Slack
        if: success() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          jq -n \
            '{text: "🚀 *Pylos Promoted to Production*\n\n✅ Version `:dev` is now `:latest` in namespace `pylos`.\n🌐 URL: https://pylos.p.zacharie.org"}' \
            | curl -X POST -H 'Content-type: application/json' -d @- $SLACK_WEBHOOK
