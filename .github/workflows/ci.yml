name: "02 · Main — CI Build & Tests (Push main)"

on:
  push:
    branches: [main, master]
    # Un commit purement documentaire ne doit declencher ni tests ni reconstruction
    # des images Docker (les workflows PR et MegaLinter restent, eux, declenches).
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'scripts/**'
      - '**/*.md'

# Une nouvelle poussee sur la meme branche annule le run precedent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check Rust (Clippy & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust Cache (cle partagee avec les workflows PR)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pylos-rust
          cache-on-failure: true
      - name: Create UI stub for rust-embed
        run: mkdir -p ui/dist
      - name: Lint with clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --workspace --lib --bins --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Verify benchmarks (hot_path)
        run: cargo bench -p pylos-application --bench hot_path --locked -- --test

  check-ui:
    name: Check UI (TypeScript & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Verify UI build
        run: npm run build --prefix ui
      - name: Run UI tests
        run: npm test --prefix ui
      - name: Lint UI
        continue-on-error: true
        run: npm run lint --prefix ui

  build-and-push:
    name: Build & Push (${{ matrix.arch }})
    needs: [check, check-ui]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          push: true
          tags: |
            ghcr.io/jzacharie/pylos:dev-${{ matrix.arch }}
            ghcr.io/jzacharie/pylos:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/jzacharie/pylos-cache:backend-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/jzacharie/pylos-cache:backend-${{ matrix.arch }},mode=max

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v7
        with:
          # ui/Dockerfile cible la racine du dépôt (package.json racine + ui/),
          # comme docker-compose.yml. Un contexte './ui' casse les COPY ui/nginx.conf
          # et ui/docker-entrypoint.sh (build CI rouge).
          context: .
          file: ./ui/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          push: true
          tags: |
            ghcr.io/jzacharie/pylos-ui:dev-${{ matrix.arch }}
            ghcr.io/jzacharie/pylos-ui:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/jzacharie/pylos-cache:frontend-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/jzacharie/pylos-cache:frontend-${{ matrix.arch }},mode=max

  merge-manifest:
    name: Merge Multi-Arch Manifests
    needs: [check, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push backend manifest
        run: |
          docker buildx imagetools create -t ghcr.io/jzacharie/pylos:dev \
            ghcr.io/jzacharie/pylos:dev-amd64 \
            ghcr.io/jzacharie/pylos:dev-arm64
          docker buildx imagetools create -t ghcr.io/jzacharie/pylos:${{ github.sha }} \
            ghcr.io/jzacharie/pylos:${{ github.sha }}-amd64 \
            ghcr.io/jzacharie/pylos:${{ github.sha }}-arm64

      - name: Create and push frontend manifest
        run: |
          docker buildx imagetools create -t ghcr.io/jzacharie/pylos-ui:dev \
            ghcr.io/jzacharie/pylos-ui:dev-amd64 \
            ghcr.io/jzacharie/pylos-ui:dev-arm64
          docker buildx imagetools create -t ghcr.io/jzacharie/pylos-ui:${{ github.sha }} \
            ghcr.io/jzacharie/pylos-ui:${{ github.sha }}-amd64 \
            ghcr.io/jzacharie/pylos-ui:${{ github.sha }}-arm64

  deploy-dev:
    name: Deploy Dev (restart pods)
    needs: [merge-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_CONTENT" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Restart pylos-dev deployments
        run: |
          kubectl rollout restart deployment pylos-server -n pylos-dev
          kubectl rollout restart deployment pylos-ui -n pylos-dev
          kubectl rollout status deployment pylos-server -n pylos-dev --timeout=3m
          kubectl rollout status deployment pylos-ui -n pylos-dev --timeout=3m
          kubectl get pods -n pylos-dev -o wide

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f $HOME/.kube/config
