name: PR Tests

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test"
        required: false
        type: string
  pull_request:
    branches: [main, master]

# Une nouvelle poussee annule le run precedent : on ne teste jamais deux fois le meme diff.
concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Quels perimetres ont change ? (evite de relancer Rust pour une PR docs/UI)
  #    Gere aussi l'echappatoire historique "--skip-ci".
  # ───────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      should-skip: ${{ steps.skip.outputs.should-skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect changed perimeters
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/pr-tests.yml'
              - '.github/workflows/scripts/**'
            ui:
              - 'ui/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/pr-tests.yml'

      - name: Check if pipeline should be skipped
        id: skip
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MESSAGE" == *"--skip-ci"* ]]; then
            echo "should-skip=true" >> $GITHUB_OUTPUT
          else
            echo "should-skip=false" >> $GITHUB_OUTPUT
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Lint Rust (rapide, parallele aux tests)
  # ───────────────────────────────────────────────────────────────────────────
  rust-lint:
    name: Rust Lint
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.should-skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust Cache (partage entre jobs)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pylos-rust
          cache-on-failure: true
      - name: Create UI stub for rust-embed
        run: mkdir -p ui/dist
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Tests Rust (parallele au lint, meme cache)
  # ───────────────────────────────────────────────────────────────────────────
  rust-tests:
    name: Rust Tests
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.should-skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache (partage entre jobs)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pylos-rust
          cache-on-failure: true
      - name: Create UI stub for rust-embed
        run: mkdir -p ui/dist
      - name: Tests
        run: cargo test --workspace --locked

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Audit de securite (ne compile rien : job tres court, en parallele)
  # ───────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.should-skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit

  # ───────────────────────────────────────────────────────────────────────────
  # 5. UI : build bloque, lint encore en observation (48 erreurs historiques)
  # ───────────────────────────────────────────────────────────────────────────
  ui-build:
    name: UI Build
    needs: [changes]
    if: needs.changes.outputs.ui == 'true' && needs.changes.outputs.should-skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix ui
      - name: Build
        run: npm run build --prefix ui
      - name: Lint (observation)
        continue-on-error: true
        run: npm run lint --prefix ui

  # ───────────────────────────────────────────────────────────────────────────
  # 6. Agregateur : c'est CE job (nom "Run Tests") qui est exige par la
  #    protection de branche. Il tourne toujours, meme si les jobs ci-dessus
  #    sont ignores (PR docs uniquement), et echoue si l'un d'eux echoue.
  # ───────────────────────────────────────────────────────────────────────────
  run-tests:
    name: Run Tests
    needs: [changes, rust-lint, rust-tests, security-audit, ui-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        id: eval
        run: |
          set -euo pipefail
          echo "perimetres : rust=${{ needs.changes.outputs.rust }} ui=${{ needs.changes.outputs.ui }} skip=${{ needs.changes.outputs.should-skip }}"

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::la detection des changements a echoue"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.should-skip }}" == "true" ]]; then
            echo "Pipeline ignore (--skip-ci)"
            exit 0
          fi

          for result in \
            "${{ needs.rust-lint.result }}" \
            "${{ needs.rust-tests.result }}" \
            "${{ needs.security-audit.result }}" \
            "${{ needs.ui-build.result }}"; do
            case "$result" in
              failure|cancelled)
                echo "::error::un job requis a echoue ($result)"
                exit 1
                ;;
            esac
          done
          echo "Tous les jobs applicables sont verts."

      - name: Comment PR
        if: always() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.eval.outcome }}" == "success" ]]; then
            body="✅ **Pylos — tests OK** (rust=${{ needs.changes.outputs.rust }}, ui=${{ needs.changes.outputs.ui }})"
          else
            body="❌ **Pylos — tests en échec** — voir le run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          gh pr comment ${{ github.event.pull_request.number }} --body "$body"
