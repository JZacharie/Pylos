# ─────────────────────────────────────────────────────────────────────────────
# Pylos — Docker Compose local
#
# Stack complète pour tester Pylos en local :
#   - pylos         : le gateway AI (port 3000)
#   - ui            : dashboard React (port 8080)
#   - prometheus    : collecte des métriques /metrics (port 9090)
#   - grafana       : dashboards (port 3001) login: admin/admin
#
# Usage :
#   cp .env.example .env          # puis remplir les clés API
#   docker compose up -d
#   open http://localhost:8080    # UI Pylos
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ───────────────────────────────────────────────────────────────────────────
  # Pylos — AI Gateway
  # ───────────────────────────────────────────────────────────────────────────
  pylos:
    build:
      context: .
      dockerfile: Dockerfile
    image: pylos:local
    container_name: pylos
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      RUST_LOG: "${RUST_LOG:-info}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ROLE_ARN: "${AWS_ROLE_ARN:-}"
      QDRANT_URL: "${QDRANT_URL:-http://qdrant.qdrant.svc:6333}"
      PYLOS_CONFIG: "/app/pylos.json"
      PYLOS_DATA_DIR: "/data"
      PYLOS_ADMIN_KEY: "${PYLOS_ADMIN_KEY:-}"
    volumes:
      - ./pylos.json:/app/pylos.json:ro
      - pylos-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - pylos-net

  # ───────────────────────────────────────────────────────────────────────────
  # Pylos UI — Dashboard React (nginx + proxy vers backend)
  # ───────────────────────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: pylos-ui:local
    container_name: pylos-ui
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      pylos:
        condition: service_healthy
    networks:
      - pylos-net

  # ───────────────────────────────────────────────────────────────────────────
  # Ollama Local LLM (Activé via profile 'ollama')
  # ───────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: pylos-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles:
      - ollama
    networks:
      - pylos-net

  # ───────────────────────────────────────────────────────────────────────────
  # Ollama Pull — Téléchargement automatique de gemma:2b (Activé via profile 'ollama')
  # ───────────────────────────────────────────────────────────────────────────
  ollama-pull:
    image: curlimages/curl:latest
    container_name: pylos-ollama-pull
    depends_on:
      - ollama
    entrypoint:
      [
        "sh",
        "-c",
        'sleep 5 && curl -X POST http://ollama:11434/api/pull -d ''{"name": "gemma:2b"}''',
      ]
    profiles:
      - ollama
    networks:
      - pylos-net

volumes:
  # prometheus-data:
  # grafana-data:
  pylos-data:
  ollama-data:

networks:
  pylos-net:
    driver: bridge
