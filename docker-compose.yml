# ─────────────────────────────────────────────────────────────────────────────
# Pylos — Docker Compose local
#
# Stack complète pour tester Pylos en local :
#   - pylos         : le gateway AI (port 3000)
#   - ui            : dashboard React (port 8080)
#   - prometheus    : collecte des métriques /metrics (port 9090)
#   - grafana       : dashboards (port 3001) login: admin/admin
#
# Usage :
#   cp .env.example .env          # puis remplir les clés API
#   docker compose up -d
#   open http://localhost:8080    # UI Pylos
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ───────────────────────────────────────────────────────────────────────────
  # Pylos — AI Gateway
  # ───────────────────────────────────────────────────────────────────────────
  pylos:
    build:
      context: .
      dockerfile: Dockerfile
    image: pylos:local
    container_name: pylos
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      RUST_LOG: "${RUST_LOG:-info}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ROLE_ARN: "${AWS_ROLE_ARN:-}"
      QDRANT_URL: "${QDRANT_URL:-http://qdrant.qdrant.svc:6333}"
      PYLOS_CONFIG: "/app/pylos.json"
      PYLOS_DATA_DIR: "/data"
      PYLOS_ADMIN_KEY: "${PYLOS_ADMIN_KEY:-}"
    volumes:
      - ./pylos.json:/app/pylos.json:ro
      - pylos-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - pylos-net

  # ───────────────────────────────────────────────────────────────────────────
  # Pylos UI — Dashboard React (nginx + proxy vers backend)
  # ───────────────────────────────────────────────────────────────────────────
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: pylos-ui:local
    container_name: pylos-ui
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      pylos:
        condition: service_healthy
    networks:
      - pylos-net

  # ───────────────────────────────────────────────────────────────────────────
  # Mem0 Sidecar — Memory Management Service
  # ───────────────────────────────────────────────────────────────────────────
  mem0-sidecar:
    build:
      context: .
      dockerfile: pylos/memory/Dockerfile
    image: pylos-mem0-sidecar:local
    container_name: pylos-mem0-sidecar
    restart: unless-stopped
    ports:
      - "7577:7577"
    environment:
      MEM0_BACKEND: "${MEM0_BACKEND:-postgres}"
      MEM0_BACKEND_URL: "${MEM0_BACKEND_URL:-postgres://postgres:postgres@postgres:5432/mem0}"
      MEM0_COLLECTION_NAME: "${MEM0_COLLECTION_NAME:-pylos-memories}"
      MEM0_EMBEDDING_MODEL: "${MEM0_EMBEDDING_MODEL:-nomic-embed-text-v2-moe-GGUF}"
      MEM0_EMBEDDING_PROVIDER: "${MEM0_EMBEDDING_PROVIDER:-ollama}"
      MEM0_EMBEDDING_BASE_URL: "${MEM0_EMBEDDING_BASE_URL:-http://192.168.0.58:11434/v1}"
      MEM0_MAX_CONTEXT_TOKENS: "${MEM0_MAX_CONTEXT_TOKENS:-2048}"
      MEM0_TTL_SECONDS: "${MEM0_TTL_SECONDS:-86400}"
      MEM0_LOG_LEVEL: "${MEM0_LOG_LEVEL:-INFO}"
    depends_on:
      pylos:
        condition: service_healthy
    networks:
      - pylos-net

  # ───────────────────────────────────────────────────────────────────────────
  # Ollama Local LLM (Activé via profile 'ollama')
  # ───────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: pylos-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles:
      - ollama
    networks:
      - pylos-net

  # ───────────────────────────────────────────────────────────────────────────
  # Ollama Pull — Téléchargement automatique de gemma:2b (Activé via profile 'ollama')
  # ───────────────────────────────────────────────────────────────────────────
  ollama-pull:
    image: curlimages/curl:latest
    container_name: pylos-ollama-pull
    depends_on:
      - ollama
    entrypoint: ["sh", "-c", "sleep 5 && curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"gemma:2b\"}'"]
    profiles:
      - ollama
    networks:
      - pylos-net

volumes:
  # prometheus-data:
  # grafana-data:
  pylos-data:
  ollama-data:

networks:
  pylos-net:
    driver: bridge
