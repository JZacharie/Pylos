{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pylos.name" . }}-network
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "pylos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pylos.labels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.backend.service.port }}
          protocol: TCP
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # External LLM providers & OTLP/HTTPS endpoints
    - ports:
        - port: 443
          protocol: TCP
    # PostgreSQL
    - ports:
        - port: 5432
          protocol: TCP
    # Qdrant
    - ports:
        - port: 6333
          protocol: TCP
    # Internal MCP servers
    - to:
        - podSelector: {}
      ports:
        - port: {{ .Values.mcp.service.port }}
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pylos.ui.name" . }}-network
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "pylos.ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pylos.ui.labels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.ui.service.port }}
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "pylos.labels" . | nindent 14 }}
      ports:
        - port: {{ .Values.backend.service.port }}
          protocol: TCP
{{- end }}
