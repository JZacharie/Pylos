namespace: pylos

imagePullSecrets:
  - name: ghcr-auth

config: |
  {
    "version": 2,
    "server": {
      "port": 3000,
      "log_level": "info",
      "enable_logging": true,
      "disable_content_logging": false,
      "database_url": "env.DATABASE_URL"
    },
    "providers": {},
    "governance": {
      "virtual_keys": []
    }
  }

database:
  enabled: false
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

qdrant:
  url: "http://qdrant.qdrant.svc:6333"

backend:
  name: pylos
  # Multi-replica (replicaCount > 1) requires database.enabled=true (PostgreSQL).
  replicaCount: 1
  existingSecret: "pylos-secret"
  existingSecretKey: "OPENCODE_API_KEY"
  image:
    repository: ghcr.io/jzacharie/pylos
    tag: latest
    pullPolicy: Always
  service:
    port: 3000
    type: ClusterIP
  # Health probes for liveness and readiness checks
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  # Optional HorizontalPodAutoscaler (requires database.enabled=true)
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  # Optional PodDisruptionBudget for safe node drains
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  dataDir: /data
  pvc:
    accessModes:
      - ReadWriteOnce
    size: 1Gi

# Default NetworkPolicy restricting ingress/egress for backend and UI
networkPolicy:
  enabled: true

ui:
  name: pylos-ui
  replicaCount: 1
  image:
    repository: ghcr.io/jzacharie/pylos-ui
    tag: latest
    pullPolicy: Always
  service:
    port: 80
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

dev:
  enabled: false
  name: pylos-dev
  replicaCount: 1
  existingSecret: "pylos-secret"
  existingSecretKey: "OPENCODE_API_KEY"
  image:
    repository: ghcr.io/jzacharie/pylos
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  dataDir: /data
  pvc:
    accessModes:
      - ReadWriteOnce
    size: 1Gi

mcp:
  image:
    repository: ghcr.io/jzacharie/pylos-mcp
    tag: latest
    pullPolicy: Always
  service:
    port: 8000
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  servers: {}
  # Example:
  # servers:
  #   my-tools:
  #     server_type: python
  #     target_url: ""
  #     env_vars:
  #       MCP_API_KEY: "sk-example"
  #       LOG_LEVEL: "debug"

secretStore:
  enabled: true
  name: vault-backend
  kind: ClusterSecretStore
  secretPath: ai/pylos
